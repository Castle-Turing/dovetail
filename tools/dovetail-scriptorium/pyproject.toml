[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dovetail-scriptorium"
version = "0.1.0"
description = "Build a worksession: a scratch file in an editor tile, a REPL beside it, a socket to co-edit through"
requires-python = ">=3.10"
dependencies = ["dovetail-seams"]

[project.scripts]
dovetail-scriptorium = "dovetail_scriptorium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
